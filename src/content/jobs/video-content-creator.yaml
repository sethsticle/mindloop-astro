summary: >-
  A short-form video specialist to shoot and edit content across our
  client portfolio, from dealership floors to service stations.
description: >-
  We're looking for a Video Content Creator to join our Durban-based
  studio. You'll shoot and edit short-form video across a range of client
  accounts - reels, behind-the-scenes content, product features and
  campaign work - turning raw footage into content people actually want to
  watch. Comfort with a camera rig, a mic, and Premiere or CapCut is a
  must. Bonus points if you can spot a good hook in the first three
  seconds without thinking about it.
