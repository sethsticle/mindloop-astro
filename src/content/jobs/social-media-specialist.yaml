title: Social Media Specialist
department: social-media-content
location: hillcrest
employmentType: full-time
status: open
summary: >-
  We're looking for a Social Media Specialist who lives for a good content
  calendar and knows how to turn a brand's daily grind into scroll-stopping
  posts.
description: >-
  MLD Marketing Solutions is looking for a Social Media Specialist to join
  our Hillcrest-based crew. You'll manage day-to-day content for a portfolio
  of client accounts - planning, scheduling, captioning and community
  management - while keeping an eye on what's actually moving the needle
  for each brand. You'll work closely with our video and design teams to
  keep every account's content calendar full, on-brand and on-schedule.
  We're after someone who's chronically online in the best way, has a
  sharp eye for what makes people stop scrolling, and isn't afraid to
  pitch a bold idea in a boogie session.
