description: >-
  MLD Marketing Solutions is hiring an Account Manager for our Durban
  studio. You'll be the primary point of contact for a portfolio of
  clients, translating their goals into briefs our content and strategy
  teams can run with, keeping projects on track, and making sure nothing
  falls through the cracks. This is a client-objective-obsessed role -
  we're looking for someone organised, communicative, and genuinely
  invested in seeing every brand we work with grow.
