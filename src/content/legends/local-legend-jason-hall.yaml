name: 'Local Legend: Jason Hall'
description: >-
  Most people would've let that moment define them. Jason Hall didn't.  After a
  life-changing accident left him paralysed, he taught himself how to weld,
  built his own off-road wheelchair, and turned his greatest setback into a
  mission to help other likeminded individuals like himself, experience the true
  outdoors once again.
