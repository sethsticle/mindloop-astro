challenge: >-
  For Shell Whetstone, our objective was to transform a traditional service
  station into a destination brand that people actively engage with online -
  rather than relying on generic fuel station content in a category with little
  standout social presence.
solution: >-
  We developed a creative direction inspired by retro advertising, bold colours
  and playful storytelling, designed to be instantly recognisable,
  scroll-stopping and memorable within a crowded social media landscape. By
  combining humour, local culture, community-focused messaging and eye-catching
  visuals, we created a social presence that feels less like a corporate fuel
  brand and more like a familiar part of everyday life - showcasing promotions,
  convenience offerings, staff personalities and customer experiences to build
  genuine connections with the local community. The result is a vibrant,
  engaging social media presence that drives brand awareness, encourages
  customer loyalty and keeps Shell Whetstone top-of-mind long after customers
  leave the forecourt.
